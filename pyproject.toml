[project]
name = "emma"
version = "0.1.0"
description = "Personal AI assistant with scheduling, memory, and voice"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "httpx-mock>=0.2.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]
gui = [
    "PySide6>=6.7",
    "requests>=2.34.2",
]
voice = [
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "piper-tts>=1.4",
    "pyttsx3>=2.90",
]
telegram = [
    "python-telegram-bot>=22.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "core*", "gui*", "voice*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "T20", "PTH"]
ignore = ["E501", "S101", "S603", "S607"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true