<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emma — Sign In</title>
<style>
:root {
  --bg: #050510;
  --bg-elevated: #0a0a1a;
  --bg-input: #0d0d24;
  --border: #1a1a3a;
  --text: #c0c0d0;
  --text-dim: #505080;
  --accent: #00e5ff;
  --accent-hover: #66f0ff;
  --accent-dim: rgba(0, 229, 255, 0.12);
  --pink: #ff00aa;
  --warn: #ffd600;
  --err: #ff00aa;
  --font: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
  --mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font);
  height: 100vh; display: flex; align-items: center; justify-content: center;
}
.card {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: 8px; padding: 40px 48px; width: 340px;
  box-shadow: 0 0 30px rgba(0,229,255,0.05);
  display: flex; flex-direction: column; align-items: center; gap: 20px;
}
.brand {
  font-family: var(--mono); font-size: 26px; font-weight: 700;
  color: var(--accent); letter-spacing: 6px;
  text-shadow: 0 0 10px rgba(0,229,255,0.5), 0 0 30px rgba(0,229,255,0.2);
}
.brand-sub {
  font-family: var(--mono); font-size: 10px; color: var(--pink);
  letter-spacing: 3px; text-shadow: 0 0 8px rgba(255,0,170,0.4);
}
input {
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 4px; padding: 10px 12px; font-size: 13px;
  color: var(--text); font-family: var(--font); width: 100%;
  letter-spacing: 0.5px; text-align: center;
}
input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 8px rgba(0,229,255,0.15); }
button {
  background: transparent; border: 1px solid var(--accent); color: var(--accent);
  border-radius: 4px; padding: 10px 16px; font-size: 11px; font-weight: 500;
  cursor: pointer; letter-spacing: 2px; text-transform: uppercase;
  font-family: var(--font); width: 100%;
}
button:hover { background: rgba(0,229,255,0.1); box-shadow: 0 0 15px rgba(0,229,255,0.15); }
button:disabled { opacity: 0.3; cursor: default; }
#status { font-size: 12px; color: var(--text-dim); min-height: 16px; text-align: center; }
#status.err { color: var(--err); }
#status.ok { color: var(--accent); }
#status.warn { color: var(--warn); }
</style>
</head>
<body>
<div class="card">
  <div>
    <div class="brand">EMMA</div>
    <div class="brand-sub">PERSONAL AI MANAGER // VOID</div>
  </div>
  <input id="password" type="password" placeholder="Password" autofocus autocomplete="current-password">
  <button id="unlock" class="primary">Unlock</button>
  <p id="status"></p>
</div>
<script>
const pw = document.getElementById('password');
const btn = document.getElementById('unlock');
const statusEl = document.getElementById('status');
let lockedUntil = 0;
let lockTimer = null;

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || '';
}

function disableForm() {
  pw.disabled = true; btn.disabled = true;
}

function startLockCountdown(seconds) {
  disableForm();
  const tick = () => {
    const left = Math.max(0, Math.ceil(lockedUntil - Date.now() / 1000));
    if (left <= 0) {
      pw.disabled = false; btn.disabled = false;
      setStatus('');
      return;
    }
    const m = Math.floor(left / 60), s = left % 60;
    setStatus(`Too many attempts — locked. Try again in ${m > 0 ? m + 'm ' : ''}${s}s`, 'warn');
    lockTimer = setTimeout(tick, 1000);
  };
  tick();
}

function handleError(res) {
  if (res.status === 401) {
    return res.json().then(data => {
      setStatus(data.detail || 'Wrong password', 'err');
      pw.select(); pw.focus();
    });
  }
  if (res.status === 429) {
    const retry = parseInt(res.headers.get('Retry-After') || '0', 10) || 0;
    lockedUntil = Date.now() / 1000 + Math.max(retry, 1);
    startLockCountdown(Math.max(retry, 1));
    return;
  }
  if (res.status === 423) {
    lockedUntil = Date.now() / 1000 + 900;
    startLockCountdown(900);
    return;
  }
  return res.json().then(d => { setStatus(d.detail || 'Login failed', 'err'); }).catch(() => setStatus('Login failed', 'err'));
}

async function unlock() {
  const p = pw.value.trim();
  if (!p) return;
  setStatus('');
  btn.disabled = true;
  try {
    const r = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: p }),
    });
    if (!r.ok) { btn.disabled = false; return handleError(r); }
    // Pass the password through to the app as the per-tab Bearer token;
    // the backend cookie covers page loads (incl. new tabs).
    sessionStorage.setItem('emma_token', p);
    location.href = '/ui/';
  } catch {
    btn.disabled = false;
    setStatus('Cannot reach server', 'err');
  }
}

btn.addEventListener('click', unlock);
pw.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
pw.focus();
</script>
</body>
</html>
